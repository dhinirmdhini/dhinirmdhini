<section class="panel">
  <h2>Pilih Tipe Penyakit</h2>
  <div class="form-row">
    <div class="select-wrap">
      <select id="penyakitSelect" class="modern-select" aria-label="Pilih penyakit">
        <option value="">-- Pilih Penyakit --</option>
      </select>
      <button id="refreshBtn" class="ghost">Refresh Data</button>
    </div>

    <div class="actions">
      <button id="diagnosaBtn" class="primary">Diagnosa</button>
      <button id="tambahJsonBtn" class="secondary hidden">Tambah Penyakit (JSON)</button>
    </div>
  </div>

  <div id="diagnosaResult" class="result-area"></div>

  <h3>Semua Penyakit (Tabel)</h3>
  <div class="table-wrap">
    <table id="diseasesTable" class="data-table">
      <thead><tr><th>No</th><th>Nama Penyakit</th><th>Penyebab</th><th>Keterangan</th><th>Gambar</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
