<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Diagnosa Penyakit Tanaman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
  <div class="brand">🌿 PlantDiag — Tugas SPK</div>
  <button class="hamburger" id="hamburgerBtn">☰</button>

    <nav class="topnav">
      <button data-link="beranda.html" class="nav-btn active">Beranda</button>
      <button data-link="tipe.html" class="nav-btn">Tipe Penyakit</button>
      <button data-link="kesimpulan.html" class="nav-btn">Kesimpulan</button>
      <button data-link="anggota.html" class="nav-btn">Data Anggota</button>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div>© 2025 — PlantDiag • Kelompok Dua</div>
  </footer>

  <script src="script.js"></script>
  <script>
    // pastikan APP sudah tersedia
    function waitForAPP() {
      if (window.APP && typeof APP.loadPage === 'function') {
        APP.loadPage('beranda.html');
      } else {
        setTimeout(waitForAPP, 50);
      }
    }
    waitForAPP();
  </script>

</body>
